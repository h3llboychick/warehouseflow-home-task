services:
  mysql:
    image: ${APPLICATION_FIXING_BASE_PROJECT_MYSQL_IMAGE:-ghcr.io/OWNER/application-fixing-base-project-mysql:latest}
    environment:
      MYSQL_DATABASE: warehouseflow_base
      MYSQL_USER: warehouseflow
      MYSQL_PASSWORD: warehouseflow
      MYSQL_ROOT_PASSWORD: rootpass
    ports:
      - "3311:3306"
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -uroot -prootpass --silent"]
      interval: 5s
      timeout: 5s
      retries: 20

  server:
    image: ${APPLICATION_FIXING_BASE_PROJECT_SERVER_IMAGE:-ghcr.io/OWNER/application-fixing-base-project-server:latest}
    environment:
      PORT: 3301
      DB_HOST: mysql
      DB_PORT: 3306
      DB_NAME: warehouseflow_base
      DB_USER: warehouseflow
      DB_PASSWORD: warehouseflow
      CLIENT_ORIGIN: http://localhost:4300
    depends_on:
      mysql:
        condition: service_healthy
    ports:
      - "3301:3301"

  client:
    image: ${APPLICATION_FIXING_BASE_PROJECT_CLIENT_IMAGE:-ghcr.io/OWNER/application-fixing-base-project-client:latest}
    environment:
      VITE_API_URL: http://localhost:3301
    depends_on:
      - server
    ports:
      - "4300:4300"
